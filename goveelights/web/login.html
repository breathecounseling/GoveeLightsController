<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>House Lights login</title>
<style>
:root{--bg:#0b0e13;--p1:#141920;--line:#2c3542;--text:#e8edf3;--dim:#8d98a7;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:22px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--dim);margin:0 0 16px;font-size:14px}
input,button{font:inherit;width:100%;border-radius:12px;padding:12px;border:1px solid var(--line)}
input{background:#1b212b;color:var(--text);margin-bottom:10px}
button{background:#1f7a43;border-color:#2f9e5a;color:#fff;font-weight:700}
#err{color:var(--bad);min-height:20px;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<form id="f">
  <h1>House Lights</h1>
  <p>Sign in to control the lights.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
  <button>Sign in</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'lights'},
                                       body: JSON.stringify({password: document.getElementById('pw').value})});
  const j = await r.json().catch(()=>({}));
  if (r.ok && j.ok) location.replace('/'); else document.getElementById('err').textContent = j.error || ('Error ' + r.status);
};
</script>
</body>
</html>
