<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Pick the lights</title>
<style>
:root{--bg:#0b0e13;--p1:#151b24;--line:#2c3542;--text:#f1f5f9;--dim:#94a3b8;--acc:#22c55e;--gold:#fbbf24;--ice:#bae6fd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1e293b,var(--bg));color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:20px 14px calc(30px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px;text-align:center}
h2{font-size:15px;margin:22px 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.msg{color:var(--dim);text-align:center;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;text-align:left}
.card:active{transform:scale(.98)}
.card canvas{display:block;width:100%;height:64px;background:#040608}
.card b{display:block;padding:9px 10px 10px;font-size:15px}
.live{background:var(--p1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.live canvas{display:block;width:100%;height:110px;background:#040608}
.live .cap{display:flex;align-items:center;gap:8px;padding:9px 12px 10px;font-size:15px}
.live .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;animation:pulse 1.6s ease-in-out infinite}
.live .dot.stale{background:#64748b;box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}
.live .cap span{color:var(--dim)}
.you{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:#14261a;border:1px solid #1f5131;color:#bbf7d0;text-align:center;font-weight:600}
.you.now{background:#2a210b;border-color:#6b5310;color:#fde68a}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:block;width:100%;padding:16px 10px;border-radius:18px;border:none;font-size:18px;font-weight:800;line-height:1.2}
.sparkle{color:#1a1300;background:linear-gradient(90deg,#fde68a,#fbbf24,#fff7d6,#fbbf24,#fde68a);background-size:200% 100%;animation:sh 3s linear infinite}
.snow{color:#082f49;background:linear-gradient(160deg,#f0f9ff,#bae6fd 60%,#7dd3fc)}
.snow small{display:block;font-size:12.5px;font-weight:600;opacity:.8;margin-top:3px}
.fx .wide{grid-column:1/-1}
@keyframes sh{to{background-position:-200% 0}}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;justify-items:center}
.sw button{width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.18);box-shadow:0 0 14px var(--c),inset 0 0 0 2px rgba(0,0,0,.25);background:var(--c)}
.sw button:active{transform:scale(.92)}
.sw button.sent{border-color:#fff}
#status{text-align:center;min-height:24px;color:var(--gold);font-weight:600;margin:12px 0 0}
.off{text-align:center;color:var(--dim);padding:30px 10px}
.net{text-align:center;color:#fca5a5;font-size:13px;min-height:18px;margin-top:6px}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:22px}
@media (prefers-reduced-motion:reduce){.sparkle,.live .dot{animation:none}}
</style>
</head>
<body>
<main>
  <h1 id="title">Pick the lights!</h1>
  <p class="msg" id="msg"></p>
  <div class="live" id="live" hidden>
    <canvas id="liveCv" aria-label="Live view of the house lights" role="img"></canvas>
    <div class="cap"><i class="dot" id="liveDot"></i><b id="nowName">Live from the house</b></div>
  </div>
  <div id="you" class="you" hidden></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="net" id="net"></div>
  <div id="body"></div>
  <footer>Your pick plays on the house for about a minute. Be kind: one pick at a time 🙂</footer>
</main>
<script>
const tok = location.pathname.split('/').filter(Boolean)[1], API = `/api/visit/${encodeURIComponent(tok || '')}/`;
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let L = null, S = null; const thumbs = {}, cards = new Map(); let frame = 0;
// Every request gives up after a few seconds, and a bad answer never throws: phones on the street have bad signal.
async function call(p, opt){
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
  try { const r = await fetch(API + p, {...opt, signal: ac.signal, cache: 'no-store'}); const j = await r.json().catch(() => null);
    $('net').textContent = ''; return j || {ok: false, error: 'Something went wrong. Try again in a moment.'} }
  catch (e){ $('net').textContent = 'Weak connection… retrying'; return {ok: false, error: 'No connection. Try again in a moment.', offline: true} }
  finally { clearTimeout(to) }
}
const get = p => call(p);
const post = (p, b) => call(p, {method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'lights'}, body: JSON.stringify(b||{})});
let saidAt = 0;
// The server's refusals are short and generic on purpose; the friendly ones start with a capital.
function nice(r){ const e = r && r.error;
  if (!e || typeof e !== 'string') return 'Try again in a moment';
  if (/^(not available|that one isn.t available)$/i.test(e)) return 'That one is resting right now, try something else!';
  return /^[A-Z]/.test(e) ? e : 'Something went wrong. Try again in a moment.' }
// After a refusal, settings may have changed (the owner switched something off): redraw soon.
function refused(r){ if (r && !r.offline) setTimeout(refresh, 300) }
function say(t, quiet){ if (quiet && Date.now() - saidAt < 6000) return; $('status').textContent = t; if (!quiet) saidAt = Date.now() }
function draw(c, hex, glow){
  if (!L || !L.pixels) return;
  if (!c._g || c._g.w !== c.clientWidth){ const dpr = devicePixelRatio||1, W = c.clientWidth, H = c.clientHeight; c.width = W*dpr; c.height = H*dpr;
    const [x0,y0,x1,y1] = L.bounds, pad = glow ? 10 : 4, sx = (W-2*pad)/Math.max(1,x1-x0), sy = (H-2*pad)/Math.max(1,(y1-y0)*1.6), s = Math.min(sx, sy);
    const ox = (W - (x1-x0)*s)/2, oy = (H + (y1-y0)*s*1.6)/2;
    c._g = {w:W, H, dpr, r: Math.max(1, Math.min(glow ? 3.4 : 2.8, s*.4)), pts: L.pixels.map(([x,y]) => [ox+(x-x0)*s, oy-(y-y0)*s*1.6])} }
  const g = c._g, x = c.getContext('2d'); x.setTransform(g.dpr,0,0,g.dpr,0,0); x.clearRect(0,0,g.w,g.H);
  for (let i = 0; i < g.pts.length; i++){ const col = hex ? hex.substr(i*6,6) : ''; const dark = !col || col==='000000' || col.length < 6;
    x.fillStyle = dark ? '#161b22' : '#'+col;
    if (glow && !dark){ x.shadowColor = '#'+col; x.shadowBlur = 6 } else x.shadowBlur = 0;
    if (glow){ x.beginPath(); x.arc(g.pts[i][0], g.pts[i][1], g.r, 0, 6.2832); x.fill() }
    else x.fillRect(g.pts[i][0]-g.r, g.pts[i][1]-g.r, g.r*2, g.r*2) }
}
setInterval(() => { if (document.hidden) return; frame++; for (const [c, id] of cards){ const d = thumbs[id]; if (d && d.frames) draw(c, d.frames[frame % d.frames.length]) } }, 125);

// ------------------------------------------------ the live view (polls the current colours)
let liveHex = '', liveOk = 0, liveDelay = 350;
async function livePoll(){
  if (!document.hidden && S && S.on && L){
    const t0 = performance.now(), d = await get('frame');
    if (d && typeof d.hex === 'string'){ liveHex = d.hex; liveOk = Date.now(); draw($('liveCv'), liveHex, true);
      liveDelay = Math.min(1500, Math.max(300, (performance.now() - t0) * 2)) }   // slow links poll less often
    else liveDelay = Math.min(5000, liveDelay * 2);
    $('liveDot').classList.toggle('stale', Date.now() - liveOk > 4000);
  }
  setTimeout(livePoll, liveDelay);
}

// ------------------------------------------------ shake for snow
const SNOW_GAP = 20000; let snowAt = 0, motionDenied = false, motionOn = false, motionSeen = false, jolts = [], lastA = null;
function onMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration; if (!a || a.x == null) return;
  if (!motionSeen){ motionSeen = true; drawSnowBtn() }        // a real motion sensor: offer the shake
  if (lastA){ const d = Math.abs(a.x - lastA.x) + Math.abs(a.y - lastA.y) + Math.abs(a.z - lastA.z), now = Date.now();
    if (d > 24){ jolts = jolts.filter(t => now - t < 1200); if (!jolts.length || now - jolts[jolts.length-1] > 90) jolts.push(now);
      if (jolts.length >= 3){ jolts = []; letItSnow(true) } } }
  lastA = {x: a.x, y: a.y, z: a.z};
}
function startMotion(){ if (motionOn) return; motionOn = true; window.addEventListener('devicemotion', onMotion) }
const needsPermission = () => typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
async function snowTap(){
  if (needsPermission() && !motionOn && !motionDenied){
    try { const r = await DeviceMotionEvent.requestPermission(); if (r === 'granted'){ startMotion(); say('Now shake your phone! ❄️'); drawSnowBtn(); return }
      motionDenied = true } catch (e) { motionDenied = true }
    drawSnowBtn();                                    // no motion: the button just says "Let it snow"
  }
  letItSnow(false);
}
async function letItSnow(shaken){
  const left = SNOW_GAP - (Date.now() - snowAt);
  if (left > 0){ if (!shaken) say(`More snow in ${Math.ceil(left/1000)} s ❄️`); return }
  snowAt = Date.now(); drawSnowBtn();
  const r = await post('snow');
  if (r.ok){ say(shaken ? 'You shook the snow loose! Look at the roof ❄️' : 'Let it snow! Look at the roof ❄️'); if (navigator.vibrate) navigator.vibrate(60);
    setTimeout(drawSnowBtn, SNOW_GAP + 100) }
  else { snowAt = 0; say(nice(r)); drawSnowBtn(); refused(r) }     // no snow fell: no cooldown either
}
function drawSnowBtn(){
  const b = document.querySelector('button.snow'); if (!b) return;
  const wait = Date.now() - snowAt < SNOW_GAP, ask = needsPermission() && !motionOn && !motionDenied;
  const label = motionSeen ? 'Shake your phone for snow' : ask ? 'Tap, then shake your phone' : 'Let it snow';
  const sub = wait ? 'more snow in a few seconds' : motionSeen ? 'or tap here' : 'a flurry over the whole house';
  b.innerHTML = `❄️ ${wait ? 'Snowing…' : esc(label)}<small>${esc(sub)}</small>`;
}

// ------------------------------------------------ send a colour
const COLOUR_GAP = 8000; let colourAt = 0;
async function sendColour(c, btn){
  const left = COLOUR_GAP - (Date.now() - colourAt);
  if (left > 0) return say(`Next colour in ${Math.ceil(left/1000)} s 🎨`);
  colourAt = Date.now(); document.querySelectorAll('.sw button').forEach(b => b.disabled = true); btn.classList.add('sent');
  const r = await post('colour', {hex: c.hex});
  if (r.ok){ say(`${c.name} is rippling across the house! 👀`); if (navigator.vibrate) navigator.vibrate(30) }
  else { colourAt = 0; say(nice(r)); refused(r) }                // that colour never played: no cooldown
  setTimeout(() => { document.querySelectorAll('.sw button').forEach(b => { b.disabled = false; b.classList.remove('sent') }) }, r.ok ? COLOUR_GAP : 600);
}

// ------------------------------------------------ your pick
function drawYou(){
  const y = S && S.you, box = $('you');
  if (!y || !S.on){ box.hidden = true; return }
  box.hidden = false; box.classList.toggle('now', !!y.playing);
  box.textContent = y.playing ? `🎉 Your pick “${y.name}” is on the house right now!`
    : y.position <= 1 && y.wait < 5 ? `Your pick “${y.name}” is up next. Watch the house! 👀`
    : `Your pick “${y.name}” is #${y.position} in line, about ${Math.max(1, Math.round(y.wait/60))} min to go. Hang tight! ✨`;
}

async function refresh(){
  const s = await get('state'); if (!s || s.ok === false || typeof s.on !== 'boolean') return;
  S = s;
  $('title').textContent = S.title; $('msg').textContent = S.message || ''; document.title = S.title || 'Pick the lights';
  $('live').hidden = !S.on;
  $('nowName').innerHTML = S.now || S.playing ? `Now playing: ${esc(S.now || S.playing)}` : 'Live from the house';
  drawYou();
  const key = JSON.stringify([S.on, S.sparkle, S.snow, S.colours, S.presets]);
  if ($('body')._k === key) return;
  $('body')._k = key;
  if (!S.on){ $('body').innerHTML = '<div class="off">The lights are off right now.<br>Come back this evening! ✨</div>'; cards.clear(); return }
  $('body').innerHTML = ''; cards.clear();
  const fx = document.createElement('div'); fx.className = 'fx';
  if (S.snow){ const b = document.createElement('button'); b.className = 'big snow' + (S.sparkle ? '' : ' wide'); b.onclick = snowTap; fx.appendChild(b) }
  if (S.sparkle){ const sp = document.createElement('button'); sp.className = 'big sparkle' + (S.snow ? '' : ' wide'); sp.textContent = '✨ Make it sparkle!';
    sp.onclick = async () => { const r = await post('sparkle'); say(r.ok ? 'Sparkle! ✨' : nice(r)); if (!r.ok) refused(r) }; fx.appendChild(sp) }
  if (fx.children.length) $('body').appendChild(fx);
  if (S.snow){ drawSnowBtn(); if (typeof DeviceMotionEvent !== 'undefined' && !needsPermission()) startMotion() }
  if (S.colours && S.colours.length){
    const h = document.createElement('h2'); h.textContent = 'Send a colour across the house'; $('body').appendChild(h);
    const sw = document.createElement('div'); sw.className = 'sw'; $('body').appendChild(sw);
    for (const c of S.colours){ if (!/^#[0-9a-f]{6}$/i.test(c.hex)) continue;
      const b = document.createElement('button'); b.style.setProperty('--c', c.hex); b.setAttribute('aria-label', 'Send ' + c.name); b.title = c.name;
      b.onclick = () => sendColour(c, b); sw.appendChild(b) }
  }
  if (S.presets.length){ const h = document.createElement('h2'); h.textContent = 'Pick the next show'; $('body').appendChild(h) }
  const grid = document.createElement('div'); grid.className = 'grid'; $('body').appendChild(grid);
  for (const p of S.presets){
    const b = document.createElement('button'); b.className = 'card'; b.innerHTML = `<canvas></canvas><b>${esc(p.name)}</b>`;
    b.onclick = async () => { const r = await post('pick', {id: p.id});
      if (r.ok) say(r.position <= 1 && !r.wait ? `“${p.name}” is coming up now! Look at the house 👀` : `You're in line! We'll show it here when it's on. ✨`);
      else say(nice(r)); refresh() };
    grid.appendChild(b); cards.set(b.querySelector('canvas'), p.id);
    if (!thumbs[p.id]) get('thumb?id=' + encodeURIComponent(p.id)).then(d => { if (d && d.frames) thumbs[p.id] = d });
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh() });
(async () => {
  for (let k = 0; k < 4 && !L; k++){ const l = await get('layout'); if (l && l.pixels) L = l; else await new Promise(r => setTimeout(r, 1500 * (k + 1))) }
  await refresh(); setInterval(() => { if (!document.hidden) refresh() }, 5000); livePoll();
})();
</script>
</body>
</html>
