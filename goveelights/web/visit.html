<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Pick the lights</title>
<style>
:root{--bg:#0b0e13;--p1:#151b24;--line:#2c3542;--text:#f1f5f9;--dim:#94a3b8;--acc:#22c55e;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1e293b,var(--bg));color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:20px 14px calc(30px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px;text-align:center}
.msg{color:var(--dim);text-align:center;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;text-align:left}
.card:active{transform:scale(.98)}
.card canvas{display:block;width:100%;height:64px;background:#040608}
.card b{display:block;padding:9px 10px 10px;font-size:15px}
.sparkle{display:block;width:100%;margin:18px 0 10px;padding:18px;border-radius:18px;border:none;font-size:20px;font-weight:800;color:#1a1300;
  background:linear-gradient(90deg,#fde68a,#fbbf24,#fff7d6,#fbbf24,#fde68a);background-size:200% 100%;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#status{text-align:center;min-height:24px;color:var(--gold);font-weight:600;margin:12px 0}
.off{text-align:center;color:var(--dim);padding:30px 10px}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<main>
  <h1 id="title">Pick the lights!</h1>
  <p class="msg" id="msg"></p>
  <div id="status"></div>
  <div id="body"></div>
  <footer>Your pick plays on the house for about a minute. Be kind: one pick at a time 🙂</footer>
</main>
<script>
const tok = location.pathname.split('/').filter(Boolean)[1], API = `/api/visit/${tok}/`;
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let L = null, S = null; const thumbs = {}, cards = new Map(); let frame = 0;
async function get(p){ const r = await fetch(API + p); return r.json() }
async function post(p, b){ const r = await fetch(API + p, {method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'lights'}, body: JSON.stringify(b||{})}); return r.json() }
let saidAt = 0;
function say(t, quiet){ if (quiet && Date.now() - saidAt < 6000) return; $('status').textContent = t; if (!quiet) saidAt = Date.now() }
function draw(c, hex){
  if (!L) return;
  if (!c._g || c._g.w !== c.clientWidth){ const dpr = devicePixelRatio||1, W = c.clientWidth, H = c.clientHeight; c.width = W*dpr; c.height = H*dpr;
    const [x0,y0,x1,y1] = L.bounds, s = (W-8)/Math.max(1,x1-x0);
    c._g = {w:W, H, dpr, r: Math.max(1, Math.min(2.8, s*.4)), pts: L.pixels.map(([x,y]) => [4+(x-x0)*s, H-4-(y-y0)*s*1.6])} }
  const g = c._g, x = c.getContext('2d'); x.setTransform(g.dpr,0,0,g.dpr,0,0); x.clearRect(0,0,g.w,g.H);
  for (let i = 0; i < g.pts.length; i++){ const col = hex ? hex.substr(i*6,6) : ''; x.fillStyle = (!col || col==='000000') ? '#161b22' : '#'+col; x.fillRect(g.pts[i][0]-g.r, g.pts[i][1]-g.r, g.r*2, g.r*2) }
}
setInterval(() => { frame++; for (const [c, id] of cards){ const d = thumbs[id]; if (d && d.frames) draw(c, d.frames[frame % d.frames.length]) } }, 125);
/* The status line for a /state reply: rebuilt on every poll, so it never goes stale. */
function statusLine(S){
  const q = S.queue ? `${S.queue} waiting` : '';
  if (!S.on) return '';
  if (S.now) return `Now playing: ${S.now}` + (q ? ` · ${q}` : '');
  if (S.busy) return 'A light show is on right now. Picks play after it' + (q ? ` · ${q}` : '');
  return q;
}
function pickLine(r, name){
  const mins = `about ${Math.max(1, Math.round((r.wait || 0)/60))} min`;
  if (r.busy) return `A light show is on right now. “${name}” plays after it (${mins})`;
  return r.position <= 1 && !r.wait ? `“${name}” is coming up now! Look at the house 👀` : `You're #${r.position} in line, ${mins}`;
}
async function refresh(){
  S = await get('state').catch(() => null); if (!S) return;
  $('title').textContent = S.title; $('msg').textContent = S.message || '';
  say(statusLine(S), true);
  const key = JSON.stringify([S.on, S.sparkle, S.presets]);
  if ($('body')._k === key) return;
  $('body')._k = key;
  if (!S.on){ $('body').innerHTML = '<div class="off">The lights are off right now.<br>Come back this evening! ✨</div>'; cards.clear(); return }
  $('body').innerHTML = ''; cards.clear();
  if (S.sparkle){ const sp = document.createElement('button'); sp.className = 'sparkle'; sp.textContent = '✨ Make it sparkle! ✨';
    sp.onclick = async () => { const r = await post('sparkle'); say(r.ok ? 'Sparkle! ✨' : r.error) }; $('body').appendChild(sp) }
  const grid = document.createElement('div'); grid.className = 'grid'; $('body').appendChild(grid);
  for (const p of S.presets){
    const b = document.createElement('button'); b.className = 'card'; b.innerHTML = `<canvas></canvas><b>${esc(p.name)}</b>`;
    b.onclick = async () => { const r = await post('pick', {id: p.id});
      if (r.ok) say(pickLine(r, p.name));
      else say(r.error || 'Try again in a moment'); refresh() };
    grid.appendChild(b); cards.set(b.querySelector('canvas'), p.id);
    if (!thumbs[p.id]) get('thumb?id=' + encodeURIComponent(p.id)).then(d => thumbs[p.id] = d).catch(() => {});
  }
}
(async () => { L = await get('layout').catch(() => null); await refresh(); setInterval(refresh, 5000) })();
</script>
</body>
</html>
